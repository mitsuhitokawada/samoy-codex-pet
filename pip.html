<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Samoy PiP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <title>Samoy PiP</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background:
          radial-gradient(circle at 20% 15%, rgba(200, 16, 46, 0.22), transparent 30%),
          radial-gradient(circle at 80% 20%, rgba(18, 108, 113, 0.24), transparent 30%),
          #111111;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      }

      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 18px;
        padding: max(22px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .mark {
        width: 12px;
        height: 28px;
        flex: 0 0 auto;
        background: #c8102e;
      }

      .player {
        display: grid;
        place-items: center;
        min-height: 0;
      }

      video {
        width: min(82vw, 430px);
        max-height: 62vh;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: #000;
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.35);
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
      }

      .pip-row {
        display: grid;
        margin: 10px 0 0;
      }

      button {
        min-height: 48px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font: 700 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
        backdrop-filter: blur(16px);
      }

      button.is-active {
        border-color: rgba(200, 16, 46, 0.72);
        background: #c8102e;
      }

      .pip-button {
        min-height: 54px;
        border-color: rgba(255, 255, 255, 0.28);
        background: #ffffff;
        color: #111111;
      }

      .note {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 13px;
        line-height: 1.55;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      a {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        color: #fff;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.1);
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true"></div>
        <h1>Samoy PiP</h1>
      </header>

      <section class="player">
        <video
          id="video"
          src="./samoy-idle.mp4"
          controls
          loop
          muted
          playsinline
          preload="auto"
          poster="./icon.png"
        ></video>
      </section>

      <section>
        <div class="actions" aria-label="animation">
          <button type="button" data-src="./samoy-idle.mp4" class="is-active">Idle</button>
          <button type="button" data-src="./samoy-waving.mp4">Wave</button>
          <button type="button" data-src="./samoy-running.mp4">Run</button>
        </div>
        <div class="pip-row">
          <button type="button" class="pip-button" id="pipButton">PiPで浮かせる</button>
        </div>
        <p class="note">
          Safariで開いてください。ボタンで浮かない場合は動画が全画面になるので、iPhone標準のPiPボタンを押してください。
        </p>
        <div class="links">
          <a href="./samoy-idle.mp4">Idle動画を直接開く</a>
          <a href="./samoy-waving.mp4">Wave動画を直接開く</a>
          <a href="./samoy-running.mp4">Run動画を直接開く</a>
        </div>
      </section>
    </main>

    <script>
      const video = document.querySelector("#video");
      const pipButton = document.querySelector("#pipButton");
      const buttons = [...document.querySelectorAll("button[data-src]")];

      async function startPip() {
        pipButton.textContent = "PiPを開始中...";
        try {
          await video.play();
        } catch {
          pipButton.textContent = "再生ボタンを押してください";
          return;
        }

        try {
          if (document.pictureInPictureEnabled && video.requestPictureInPicture) {
            await video.requestPictureInPicture();
            pipButton.textContent = "PiPで表示中";
            return;
          }
        } catch {
          // iOS Safariでは未対応や権限状態によりここへ来ることがある。
        }

        try {
          if (
            typeof video.webkitSupportsPresentationMode === "function" &&
            video.webkitSupportsPresentationMode("picture-in-picture") &&
            typeof video.webkitSetPresentationMode === "function"
          ) {
            video.webkitSetPresentationMode("picture-in-picture");
            pipButton.textContent = "PiPで表示中";
            return;
          }
        } catch {
          // PiPが直接開始できない場合は全画面へ切り替える。
        }

        pipButton.textContent = "標準プレイヤーで開きます";
        window.location.href = video.currentSrc || video.src;
      }

      buttons.forEach((button) => {
        button.addEventListener("click", async () => {
          buttons.forEach((item) => item.classList.toggle("is-active", item === button));
          video.src = button.dataset.src;
          video.load();
          try {
            await video.play();
          } catch {
            // iPhoneではユーザー操作後でも自動再生が止まる場合があるため、再生ボタンに任せる。
          }
        });
      });

      pipButton.addEventListener("click", startPip);
    </script>
  </body>
</html>
