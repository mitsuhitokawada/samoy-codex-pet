<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7efe2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Samoy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Samoy</title>
    <style>
      :root {
        --frame-width: 192;
        --frame-height: 208;
        --pet-size: min(58vw, 270px);
        --ink: #24211f;
        --paper: #f7efe2;
        --line: rgba(36, 33, 31, 0.14);
        --red: #c8102e;
        --teal: #126c71;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 18%, rgba(200, 16, 46, 0.16), transparent 28%),
          radial-gradient(circle at 82% 22%, rgba(18, 108, 113, 0.18), transparent 28%),
          linear-gradient(160deg, #fffaf0 0%, var(--paper) 48%, #eaf2ee 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        touch-action: none;
      }

      .stage {
        position: fixed;
        inset: 0;
        padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
          max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      }

      .brand {
        position: absolute;
        top: max(18px, env(safe-area-inset-top));
        left: max(18px, env(safe-area-inset-left));
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .brand::before {
        width: 10px;
        height: 22px;
        content: "";
        background: var(--red);
      }

      .pet {
        position: absolute;
        left: 50%;
        top: 48%;
        width: var(--pet-size);
        aspect-ratio: 192 / 208;
        background-image: url("./spritesheet.webp");
        background-repeat: no-repeat;
        filter: drop-shadow(0 18px 16px rgba(36, 33, 31, 0.22));
        image-rendering: pixelated;
        transform: translate(-50%, -50%) scale(var(--scale, 1));
        transform-origin: center bottom;
        transition: filter 160ms ease, transform 160ms ease;
        will-change: transform, background-position;
      }

      .pet.is-held {
        filter: drop-shadow(0 24px 20px rgba(36, 33, 31, 0.26));
        --scale: 1.05;
      }

      .shadow {
        position: absolute;
        left: 50%;
        top: calc(48% + min(30vw, 142px));
        width: min(42vw, 200px);
        height: 24px;
        border-radius: 999px;
        background: rgba(36, 33, 31, 0.14);
        transform: translateX(-50%);
        filter: blur(7px);
        pointer-events: none;
      }

      .controls {
        position: absolute;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        left: max(14px, env(safe-area-inset-left));
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }

      button {
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--ink);
        font: 700 19px/1 -apple-system, BlinkMacSystemFont, sans-serif;
        backdrop-filter: blur(16px);
        box-shadow: 0 8px 22px rgba(36, 33, 31, 0.08);
      }

      button.is-active {
        border-color: rgba(200, 16, 46, 0.36);
        color: #fff;
        background: var(--red);
      }

      .status-dot {
        position: absolute;
        right: max(20px, env(safe-area-inset-right));
        top: max(22px, env(safe-area-inset-top));
        width: 12px;
        height: 12px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 999px;
        background: var(--teal);
        box-shadow: 0 0 0 5px rgba(18, 108, 113, 0.12);
      }

      @media (orientation: landscape) {
        :root {
          --pet-size: min(34vw, 230px);
        }

        .pet {
          top: 50%;
        }

        .shadow {
          top: calc(50% + min(17vw, 118px));
        }

        .controls {
          left: auto;
          width: min(420px, 58vw);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Samoy pet">
      <div class="brand">Samoy</div>
      <div class="status-dot" aria-hidden="true"></div>
      <div class="shadow" aria-hidden="true"></div>
      <div class="pet" id="pet" role="img" aria-label="Samoy"></div>
      <nav class="controls" aria-label="actions">
        <button type="button" data-state="idle" aria-label="idle" class="is-active">●</button>
        <button type="button" data-state="waving" aria-label="wave">◠</button>
        <button type="button" data-state="jumping" aria-label="jump">↑</button>
        <button type="button" data-state="running" aria-label="work">▶</button>
        <button type="button" data-state="review" aria-label="review">◇</button>
      </nav>
    </main>

    <script>
      const pet = document.querySelector("#pet");
      const buttons = [...document.querySelectorAll("button[data-state]")];
      const states = {
        idle: { row: 0, frames: 6, speed: 160 },
        "running-right": { row: 1, frames: 8, speed: 100 },
        "running-left": { row: 2, frames: 8, speed: 100 },
        waving: { row: 3, frames: 4, speed: 130 },
        jumping: { row: 4, frames: 5, speed: 115 },
        failed: { row: 5, frames: 8, speed: 145 },
        waiting: { row: 6, frames: 6, speed: 165 },
        running: { row: 7, frames: 6, speed: 110 },
        review: { row: 8, frames: 6, speed: 150 },
      };

      let currentState = "idle";
      let frame = 0;
      let timer = 0;
      let lastTap = 0;
      let drag = null;
      let position = { x: window.innerWidth / 2, y: window.innerHeight * 0.48 };

      function setFrame() {
        const state = states[currentState];
        const frameWidth = pet.offsetWidth;
        const frameHeight = pet.offsetHeight;
        pet.style.backgroundSize = `${frameWidth * 8}px ${frameHeight * 9}px`;
        pet.style.backgroundPosition = `${-frameWidth * frame}px ${-frameHeight * state.row}px`;
      }

      function setState(name) {
        currentState = name;
        frame = 0;
        setFrame();
        clearInterval(timer);
        timer = window.setInterval(() => {
          const state = states[currentState];
          frame = (frame + 1) % state.frames;
          setFrame();
        }, states[currentState].speed);
        buttons.forEach((button) => button.classList.toggle("is-active", button.dataset.state === name));
      }

      function placePet(x, y) {
        const width = pet.offsetWidth;
        const height = pet.offsetHeight;
        position = {
          x: Math.max(width / 2, Math.min(window.innerWidth - width / 2, x)),
          y: Math.max(height / 2 + 18, Math.min(window.innerHeight - height / 2 - 58, y)),
        };
        pet.style.left = `${position.x}px`;
        pet.style.top = `${position.y}px`;
        document.querySelector(".shadow").style.left = `${position.x}px`;
        document.querySelector(".shadow").style.top = `${position.y + height * 0.58}px`;
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => setState(button.dataset.state));
      });

      pet.addEventListener("pointerdown", (event) => {
        pet.setPointerCapture(event.pointerId);
        pet.classList.add("is-held");
        drag = {
          pointerId: event.pointerId,
          offsetX: event.clientX - position.x,
          offsetY: event.clientY - position.y,
        };
      });

      pet.addEventListener("pointermove", (event) => {
        if (!drag || drag.pointerId !== event.pointerId) return;
        placePet(event.clientX - drag.offsetX, event.clientY - drag.offsetY);
      });

      pet.addEventListener("pointerup", (event) => {
        pet.releasePointerCapture(event.pointerId);
        pet.classList.remove("is-held");
        drag = null;
        const now = Date.now();
        if (now - lastTap < 320) setState("jumping");
        lastTap = now;
      });

      window.addEventListener("resize", () => placePet(position.x, position.y));

      placePet(position.x, position.y);
      setState("idle");
    </script>
  </body>
</html>
